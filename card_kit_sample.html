<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Card Kit 1.586:1 樣本預覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f5f5f5; --ink:#1c1c1e; --sub:#8e8e93;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141416; --ink:#f2f2f7; --sub:#8e8e93; color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141416; --ink:#f2f2f7; --sub:#8e8e93; color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,"SF Pro Text","PingFang TC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
main{max-width:760px;margin:0 auto;padding:20px 20px 48px}
h1{font-size:15px;font-weight:600;margin:8px 0 4px}
.hint{font-size:13px;color:var(--sub);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px}

/* ---------- Card base (所有卡共用) ---------- */
.card{container-type:inline-size;width:100%;aspect-ratio:1.586/1}
.face{position:relative;width:100%;height:100%;border-radius:16px;overflow:hidden;
  --fg:#1c1c1e; --muted:#a1a1a6; --dot:#444; --pan:#333; --exp:#444; --tiny:#b0b0b5;
  color:var(--fg);font-variant-numeric:tabular-nums}
.face>*{position:absolute;white-space:nowrap;line-height:1}
.logo{left:9cqw;top:11cqw;width:17cqw;height:10.8cqw}
.nfc{left:32.5cqw;top:12.4cqw;width:5.4cqw;height:5.4cqw;color:var(--muted)}
.info{right:12.4cqw;top:13.4cqw;width:4.6cqw;height:4.6cqw;color:var(--muted)}
.label{left:10.7cqw;top:26.4cqw;transform:translateY(-50%);font-size:3.6cqw;font-weight:400;color:var(--muted)}
.pan{left:10.7cqw;top:34.3cqw;transform:translateY(-50%);display:flex;align-items:center;gap:5cqw}
.pan .g{display:inline-flex;gap:1.1cqw}
.pan .g b{width:3.1cqw;height:3.1cqw;border-radius:50%;background:var(--dot)}
.pan .last{margin-left:1.2cqw;font-size:5.3cqw;font-weight:700;letter-spacing:.14em;color:var(--pan)}
.name{left:11.2cqw;top:51cqw;transform:translateY(-50%);font-size:4.3cqw;font-weight:700}
.exp{right:12.4cqw;top:51cqw;transform:translateY(-50%);display:flex;align-items:center;gap:1.6cqw}
.exp small{font-size:1.7cqw;font-weight:600;line-height:1.15;color:var(--tiny);letter-spacing:.04em}
.exp span{font-size:4.2cqw;font-weight:600;letter-spacing:.05em;color:var(--exp)}

/* 可編輯文字 */
[contenteditable]{outline:none;cursor:text;-webkit-user-select:text;user-select:text;border-radius:.8cqw;min-width:1ch}
[contenteditable]:focus{background:rgba(10,132,255,.14);box-shadow:0 0 0 .8cqw rgba(10,132,255,.14)}

/* ---------- 01 白色玻璃 Mastercard Debit ---------- */
.c-white .face{
  background:linear-gradient(180deg,#ffffff 0%,#fafafa 100%);
  box-shadow:
    inset 0 0 0 .7cqw rgba(255,255,255,.95),
    inset 0 0 3.2cqw rgba(0,0,0,.04),
    0 0 0 .3cqw rgba(0,0,0,.035),
    0 3cqw 6cqw -2.5cqw rgba(0,0,0,.09);
}
.more{display:contents}
.visa-logo{top:13.2cqw;height:5.6cqw}
.cent{width:10.8cqw;height:10.8cqw}
.visa .label{top:23.2cqw}
.c-visa-light .face{--fg:#2c2c34;--muted:#8e8a92;--dot:#3a3a40;--pan:#2c2c34;--exp:#3a3a40;--tiny:#9a96a0;background:radial-gradient(75% 75% at 12% -5%,#ff5c7c,rgba(255,92,124,0)),radial-gradient(55% 55% at 95% 5%,#ffb8c6,rgba(255,184,198,0)),radial-gradient(70% 70% at 8% 108%,#52cfd6,rgba(82,207,214,0)),radial-gradient(45% 55% at 62% 105%,#cdeef0,rgba(205,238,240,0)),#f8f2ef;box-shadow:inset 0 0 0 .7cqw rgba(255,255,255,.55),0 3cqw 6cqw -2.5cqw rgba(0,0,0,.12)}
.c-dark .face,.c-visa-dark .face{--fg:#fff;--muted:rgba(255,255,255,.55);--dot:#fff;--pan:#fff;--exp:#fff;--tiny:rgba(255,255,255,.5);box-shadow:inset 0 0 0 .6cqw rgba(255,255,255,.14),inset 0 -2cqw 4cqw rgba(0,0,0,.16),0 3cqw 6cqw -2.5cqw rgba(0,0,0,.3)}
.c-dark .face{background:linear-gradient(180deg,#646466,#565658)}
.c-visa-dark .face{background:radial-gradient(80% 60% at 0% 110%,#ff2d95,rgba(255,45,149,0)),radial-gradient(70% 55% at 80% 105%,#d4247f,rgba(212,36,127,0)),radial-gradient(70% 80% at 100% 0%,#4b3d9f,rgba(75,61,159,0)),#1b1a40}
.c-silver .face,.c-bronze .face{box-shadow:inset 0 0 0 .5cqw rgba(255,255,255,.4),0 3cqw 6cqw -2.5cqw rgba(0,0,0,.28),0 0 0 .3cqw rgba(0,0,0,.12)}
.c-silver .face{--fg:#2a2a2c;--muted:#6f6f74;--dot:#3b3b3e;--pan:#2a2a2c;--exp:#3a3a3d;--tiny:#7a7a80;background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,.07) 0 .6deg,rgba(0,0,0,.045) .6deg 1.2deg),conic-gradient(from 20deg at 50% 52%,#d6d6d9,#fbfbfc,#b4b4b9,#f1f1f3,#a6a6ac,#eeeef0,#bdbdc2,#fafafb,#cfcfd3,#a9a9af,#ededef,#d6d6d9)}
.c-bronze .face{--fg:#fff;--muted:rgba(255,235,220,.7);--dot:#fff;--pan:#fff;--exp:#fff;--tiny:rgba(255,235,220,.6);background:repeating-conic-gradient(from 0deg at 50% 52%,rgba(255,255,255,.06) 0 .6deg,rgba(0,0,0,.07) .6deg 1.2deg),conic-gradient(from 20deg at 50% 52%,#6a4128,#c08a5e,#7a4a30,#b87f55,#5a3722,#b27a52,#74472e,#c4906a,#6a4128,#5e3a25,#b9835a,#6a4128)}
.stack{position:relative;aspect-ratio:100/68;width:100%}
.stack .card{position:absolute;width:80%;left:calc(var(--i)*10%);top:calc(var(--i)*11.8%);z-index:calc(3 - var(--i))}
.glass .face{-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
.c-white.glass .face{background:rgba(255,255,255,.5)}
.c-dark.glass .face{background:rgba(56,56,62,.6)}
.bgwave{inset:0;width:100%;height:100%}
.c-visa-light .face{background:#f7f1ee}
.cent{left:10.5cqw;top:5.5cqw;width:15.6cqw;height:18.2cqw;object-fit:contain}


body {
  background: #0b0c10;
  color: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans TC', sans-serif;
  margin: 0;
  padding: 40px 24px 60px;
  -webkit-font-smoothing: antialiased;
}
.container {
  max-width: 960px;
  margin: 0 auto;
}
.header {
  text-align: center;
  margin-bottom: 36px;
}
.header h1 {
  font-size: 26px;
  font-weight: 800;
  color: #ffffff;
  letter-spacing: -0.5px;
  margin: 0 0 10px;
}
.header p {
  font-size: 14px;
  color: #8e8e93;
  margin: 0 0 14px;
  line-height: 1.5;
}
.badge-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(10, 132, 255, 0.12);
  border: 1px solid rgba(10, 132, 255, 0.3);
  color: #5ac8fa;
  font-size: 12px;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 999px;
  letter-spacing: 0.2px;
}
.grid-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 32px 28px;
}
.card-unit {
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 20px;
  padding: 20px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}
.card-title {
  font-size: 15px;
  font-weight: 700;
  color: #f5f5f7;
}
.card-spec {
  font-size: 12px;
  color: #8e8e93;
  font-family: ui-monospace, SFMono-Regular, monospace;
}
.card-desc {
  font-size: 12px;
  color: #636366;
  margin-top: -8px;
}
.card {
  aspect-ratio: 1.586 / 1 !important;
  width: 100%;
  filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.5));
}
.face {
  border-radius: 16px !important;
}
</style>
